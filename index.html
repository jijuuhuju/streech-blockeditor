<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=0.85, user-scalable=no">
    <meta name="google" value="notranslate">
    <link rel="icon" type="image/svg+xml" href="static/icon.svg">
    <title>Streech editor</title>
    
    <style>
       html, body {
        overflow: hidden;
        background-color: #000;
      }
      /* 画面サイズをiPadに合わせる設定 */
      #app, body > div {
        transform: scale(0.85); 
        transform-origin: center center;
        width: 117.6% !important;  
        height: 117.6% !important; 
        position: absolute;
        top: -8.8%;   
        left: -8.8%;  
      }

      /* 🎨 ここでナビゲーションバーを強制的に緑色（00d631）にします */
      div[class*="menu-bar_menu-bar"],
      [class*="menu-bar_menu-bar"] {
        background-color: #00d631 !important; 
      }

      /* 🦊 ここから追加：ロゴの上に透明な「クリック判定」を重ねて、公式リンクを無効化します */
      div[class*="menu-bar_logo_"],
      [class*="menu-bar_logo_"] {
        position: relative !important;
        pointer-events: auto !important; /* クリックできるようにする */
      }

      div[class*="menu-bar_logo_"]::after,
      [class*="menu-bar_logo_"]::after {
        content: "" !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        cursor: pointer !important;
        z-index: 9999 !important; /* 一番手前に持ってくる */
      }
    </style>
  </head>
  <body>
    <script type="text/javascript" src="lib.min.js"></script>
    <script type="text/javascript" src="chunks/gui.js"></script>

    <!-- 🛠️ ここから追加：ロゴがタップされたら自分のサイトに移動させるプログラム（フリーズしません） -->
    <script>
      document.addEventListener('click', (e) => {
        // タップされた場所がロゴ（またはロゴの重ね合わせ部分）だった場合
        if (e.target.matches('div[class*="menu-bar_logo_"]') || e.target.closest('div[class*="menu-bar_logo_"]')) {
          e.preventDefault();  // 公式サイトへ行く元のリンクをキャンセル
          e.stopPropagation(); // イベントの連鎖を止める
          
          // 🛑 移動したいURLをここに書きます（今はあなたのトップページになっています）
          window.location.href = 'https://github.io';
        }
      }, true); // trueをつけて最優先でクリックをキャッチします
    </script>
  </body>
</html>
