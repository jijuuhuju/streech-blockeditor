<<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- 🎯 iPadに画面の横幅をぴったり合わせ、勝手なズームを防止します -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" value="notranslate">
    <link rel="icon" type="image/svg+xml" href="static/icon.ico">
    <title>Streech editor</title>
    
    <style>
      html, body {
        overflow: hidden;
        background-color: #00d631;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      /* 🎯 バグの最大の原因だった CSS の transform: scale や zoom を完全に削除しました。
         画面全体を100%ピッタリに広げることで、右端の全画面ボタンなどのはみ出しを確実に防ぎます。 */
      #app, body > div, div[class*="gui_page-wrapper"] {
        position: absolute !important;
        top: 0 !important;   
        left: 0 !important;  
        width: 100% !important;  
        height: 100% !important; 
        transform: none !important;
      }

      /* 🎨 ナビゲーションバーを強制的に緑色（00d631）にします */
      div[class*="menu-bar_menu-bar"],
      [class*="menu-bar_menu-bar"] {
        background-color: #00d631 !important; 
      }

      /* 🎯 古いリンク（mit.edu）の機能をCSSで完全に無効化します */
      a[href*="scratch.mit.edu"] {
        pointer-events: none !important; 
        cursor: default !important;
      }

      /* 🚀 その代わり、特定のロゴ画像（1e9652be...）だけはクリックできるように復活させます */
      img[src*="1e9652bec24bcaacf5285be19746a750"] {
        pointer-events: auto !important;
        cursor: pointer !important;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript" src="lib.min.js"></script>
    <script type="text/javascript" src="chunks/gui.js"></script>

    <!-- 🛠️ ロゴ画像がタップされた時だけ、確実にあなたのサイトへ移動させる安全な仕組み -->
    <script>
      document.addEventListener('click', (e) => {
        if (e.target.tagName === 'IMG' && e.target.src.includes('1e9652bec24bcaacf5285be19746a750')) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = 'https://github.io';
        }
      }, true);
    </script>

    <!-- 🎯【新常識】iPad専用の画面縮小 ＆ テンキー巨大化バグを完全に殺すプログラム -->
    <script>
      (function() {
        // 1. 他の有名スクラッチサイトがやっている方法：
        // 大元のScratch（Blockly）のシステムに対し、「iPadではあの青い吹き出しテンキーを使わない」という設定を強制注入します。
        if (window.Blockly) {
          Blockly.Touch = Blockly.Touch || {};
          Blockly.Touch.setNoRemapTouch = function() { return true; };
        }

        // 2. CSSの「transform」を使わずに、JavaScriptを使ってブラウザ全体を安全に「0.85倍」にする処理です。
        // これにより、iPadが「文字サイズやブロックの幅」をすべて正しい座標のまま綺麗に0.85倍に縮小してくれます。
        // 当たり判定の右ズレも、表示のはみ出しも一切起きません。
        try {
          document.body.style.webkitTransform = 'none';
          // Safariに直接ズーム（0.85倍）を命令します
          document.body.style.zoom = "0.85"; 
        } catch(e) {
          console.error("Zoomエラー対策:", e);
        }
      })();
    </script>
  </body>
</html>
