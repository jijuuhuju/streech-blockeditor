    <!-- 🟢 2023年6月前のScratchに安全に2つのオリジナルブロックを直結させるプログラム -->
    <script>
      window.addEventListener('load', () => {
        // Scratchのエディター（Blockly）が画面に準備できるまで少し待つ
        const checkBlockly = setInterval(() => {
          if (window.Blockly && window.Blockly.Blocks) {
            clearInterval(checkBlockly);

            // 🔄 1. 「逆にする」ブロックの仕組みを登録
            window.Blockly.Blocks['streech_reverse'] = {
              init: function() {
                this.jsonInit({
                  "message0": "%1 を逆にする",
                  "args0": [{"type": "input_value", "name": "TEXT"}],
                  "category": "operators", // 🟩 演算カテゴリ（緑色）に入れる
                  "checkboxInFlyout": false,
                  "output": "String", // 丸型ブロックにする
                  "colour": "#5CB33F", // 演算ブロックと同じ緑色
                  "colourSecondary": "#469E2B",
                  "colourTertiary": "#3B8523"
                });
              }
            };
            // 「逆にする」の実際のJavaScript処理
            window.Blockly.JavaScript = window.Blockly.JavaScript || {};
            window.Blockly.JavaScript['streech_reverse'] = function(block) {
              const text = window.Blockly.JavaScript.valueToCode(block, 'TEXT', window.Blockly.JavaScript.ORDER_NONE) || "''";
              return ["String(" + text + ").split('').reverse().join('')", window.Blockly.JavaScript.ORDER_FUNCTION_CALL];
            };

            // 🎲 2. 「バラバラにする」ブロックの仕組みを登録
            window.Blockly.Blocks['streech_shuffle'] = {
              init: function() {
                this.jsonInit({
                  "message0": "%1 をバラバラにする",
                  "args0": [{"type": "input_value", "name": "TEXT"}],
                  "category": "operators", // 🟩 演算カテゴリ（緑色）に入れる
                  "checkboxInFlyout": false,
                  "output": "String", // 丸型ブロックにする
                  "colour": "#5CB33F",
                  "colourSecondary": "#469E2B",
                  "colourTertiary": "#3B8523"
                });
              }
            };
            // 「バラバラにする」の実際のJavaScript処理
            window.Blockly.JavaScript['streech_shuffle'] = function(block) {
              const text = window.Blockly.JavaScript.valueToCode(block, 'TEXT', window.Blockly.JavaScript.ORDER_NONE) || "''";
              return ["String(" + text + ").split('').sort(function(){return Math.random()-0.5}).join('')", window.Blockly.JavaScript.ORDER_FUNCTION_CALL];
            };

            console.log('Streech: 2つのブロックの登録に成功しました！');
          }
        }, 1000); // 1秒ごとにエディターの起動をチェック
      });
    </script>
