<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=0.85, user-scalable=no">
    <meta name="google" value="notranslate">
    <link rel="icon" type="image/svg+xml" href="static/icon.svg">
    <title>Streech editor</title>
    
    <style>
       html, body {
        overflow: hidden;
        background-color: #00d631;
      }
      /* 画面サイズをiPadに合わせる設定 */
      #app, body > div {
        transform: scale(0.85); 
        transform-origin: center center;
        width: 117.6% !important;  
        height: 117.6% !important; 
        position: absolute;
        top: -8.8%;   
        left: -8.8%;  
      }

      /* 🎨 ここでナビゲーションバーを強制的に緑色（00d631）にします */
      div[class*="menu-bar_menu-bar"],
      [class*="menu-bar_menu-bar"] {
        background-color: #00d631 !important; 
      }

      /* 🎯 ロゴの元々の公式リンク（mit.edu）のクリック判定を完全に消す */
      div[class*="menu-bar_logo_"] a,
      a[href*="scratch.mit.edu"] {
        pointer-events: none !important; 
      }

      /* 🚀 リンクを消したロゴの「真上」に、あなたのサイトへの新しいリンク用の透明な壁を作ります */
      div[class*="menu-bar_logo_"] {
        position: relative !important;
      }
      
      div[class*="menu-bar_logo_"]::after {
        content: "" !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        cursor: pointer !important;
        pointer-events: auto !important; /* ここだけクリックできるようにする */
        z-index: 9999 !important;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript" src="lib.min.js"></script>
    <script type="text/javascript" src="chunks/gui.js"></script>

    <!-- 🛠️ ロゴがタップされたらあなたのサイトのトップページに移動させる（JavaScriptもCSSと連動させて確実に動かします） -->
    <script>
      // 画面上のどこかがクリックされた時
      document.addEventListener('click', (e) => {
        // クリックされたのがロゴの場所（menu-bar_logo_）だった場合
        if (e.target.closest('div[class*="menu-bar_logo_"]')) {
          // あなたのトップページへ移動させる
          window.location.href = 'https://github.io';
        }
      }, true); // trueで最優先でキャッチ
    </script>
  </body>
</html>
