<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- 🎯【変更点1】iPadの無視バグ対策として、一度標準の1.0に戻します -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" value="notranslate">
    <link rel="icon" type="image/svg+xml" href="static/icon.ico">
    <title>Streech editor</title>
    
    <style>
      /* 🎯【変更点2】エディタだけでなく、後から生成されるテンキーの吹き出しも含めて、
         画面の最上層（htmlタグ）から丸ごと一括で0.85倍に縮小します。
         すべてが同じ倍率で縮小されるため、iPadの計算が絶対に狂わなくなり、
         あなたの理想の画面サイズを維持したまま、吹き出しの崩壊を完璧に防ぎます。 */
      html {
        transform: scale(0.85) !important;
        transform-origin: top left !important; /* 左上を基準にしてきれいに縮小 */
        width: 117.65% !important;  /* 1 / 0.85 の計算値（はみ出し防止） */
        height: 117.65% !important; /* 1 / 0.85 の計算値（はみ出し防止） */
        overflow: hidden;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        height: 100% !important;
        background-color: #00d631;
      }

      #app, body > div {
        position: absolute;
        top: 0;   
        left: 0;  
        width: 100% !important;  
        height: 100% !important; 
      }

      /* 🎨 ナビゲーションバーを強制的に緑色（00d631）にします */
      div[class*="menu-bar_menu-bar"],
      [class*="menu-bar_menu-bar"] {
        background-color: #00d631 !important; 
      }

      /* 🎯 古いリンク（mit.edu）の機能をCSSで完全に無効化します */
      a[href*="scratch.mit.edu"] {
        pointer-events: none !important; 
        cursor: default !important;
      }

      /* 🚀 その代わり、特定のロゴ画像（1e9652be...）だけはクリックできるように復活させます */
      img[src*="1e9652bec24bcaacf5285be19746a750"] {
        pointer-events: auto !important;
        cursor: pointer !important;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript" src="lib.min.js"></script>
    <script type="text/javascript" src="chunks/gui.js"></script>

    <!-- 🛠️ ロゴ画像がタップされた時だけ、確実にあなたのサイトへ移動させる安全な仕組み -->
    <script>
      document.addEventListener('click', (e) => {
        if (e.target.tagName === 'IMG' && e.target.src.includes('1e9652bec24bcaacf5285be19746a750')) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = 'https://github.io';
        }
      }, true);
    </script>
  </body>
</html>
