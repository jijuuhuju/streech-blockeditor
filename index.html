<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=0.85, user-scalable=no">
    <meta name="google" value="notranslate">
    <link rel="icon" type="image/svg+xml" href="static/icon.svg">
    <title>Streech editor</title>
    
    <style>
      /* 🐱 暴走を止めて、ステージとコスチュームのネコだけをピンポイントですり替える */
[class*="stage_stage"] image,
[class*="sprite-selector_"] img,
[class*="paint-editor_"] image {
  content: url("static/player.svg") !important;
  href: url("static/player.svg") !important;
}
  html, body {
        overflow: hidden;
        background-color: #000;
      }
      /* 画面サイズをiPadに合わせる設定 */
      #app, body > div {
        transform: scale(0.85); 
        transform-origin: center center;
        width: 117.6% !important;  
        height: 117.6% !important; 
        position: absolute;
        top: -8.8%;   
        left: -8.8%;  
      }

      /* 🎨 ここでナビゲーションバーを強制的に緑色（00d631）にします */
      div[class*="menu-bar_menu-bar"],
      [class*="menu-bar_menu-bar"] {
        background-color: #00d631 !important; 
      }
    </style>
  </head>
  <body>
    <script type="text/javascript" src="lib.min.js"></script>
    <script type="text/javascript" src="chunks/gui.js"></script>
  </body>
</html>
