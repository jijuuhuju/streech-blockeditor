<style>
  html, body {
    overflow: hidden;
    background-color: #00d631;

  /* 🎯 【画面サイズ設定】zoomを使うことで判定のズレと入力欄の崩れを防ぎます */

  }

  /* 🎨 【復活！】ナビゲーションバーを強制的に緑色（00d631）にします */
  div[class*="menu-bar_menu-bar"],
  [class*="menu-bar_menu-bar"] {
    background-color: #00d631 !important; 
  }

  /* 🎯 古いリンク（mit.edu）の機能をCSSで完全に無効化します */

    pointer-events: none !important; 
    cursor: default !important;
  }

  /* 🚀 その代わり、特定のロゴ画像（1e9652be...）だけはクリックできるように復活させます */

    pointer-events: auto !important;
    cursor: pointer !important;
  }
</style>
