<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" value="notranslate">
    <link rel="shortcut icon" href="static/webicon.ico">
    <title>Streech editor（ストリーチ）</title>
  </head>
  <body>
    <style>
      html, body {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        overflow: hidden !important;
      }
      [class*="menu-bar_menu-bar_"] { background-color: #00d631 !important; }
    </style>
    <script type="text/javascript" src="lib.min.js"></script>
    <script type="text/javascript" src="chunks/gui.js"></script>

    <!-- ⬇️ 読み込み完了後に、ブロックのデフォルト倍率を0.85倍に強制書き換えするスクリプト -->
    <script type="text/javascript">
      (function() {
        const checkBlockly = setInterval(() => {
          if (window.Blockly && window.Blockly.Options) {
            // Blockly全体の初期ズーム倍率のデフォルト値を 0.85 に設定
            const originalParse = window.Blockly.Options.parseZoomOptions_;
            if (originalParse) {
              window.Blockly.Options.parseZoomOptions_ = function(options) {
                const parsed = originalParse.call(this, options);
                parsed.startScale = 0.85; // 初期倍率を0.85倍にする
                return parsed;
              };
              clearInterval(checkBlockly);
            }
          }
        }, 100);
        // 5秒経っても見つからなければ終了
        setTimeout(() => clearInterval(checkBlockly), 5000);
      })();
    </script>
  </body>
</html>
