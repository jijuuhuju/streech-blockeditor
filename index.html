<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=0.85, user-scalable=no">
    <meta name="google" value="notranslate">
    <link rel="icon" type="image/svg+xml" href="static/icon.ico">
    <title>Streech editor</title>
    
    <style>
       html, body {
        overflow: hidden;
        background-color: #00d631;
      }
      /* 画面サイズをiPadに合わせる設定 */
      #app, body > div {
        transform: scale(0.85); 
        transform-origin: center center;
        width: 117.6% !important;  
        height: 117.6% !important; 
        position: absolute;
        top: -8.8%;   
        left: -8.8%;  
      }
/* 🎯 これだけで解決：テンキー全体のズレと巨大化を相殺して元に戻す */
.blocklyDropDownDiv {
  transform: scale(calc(1 / 0.85)) !important; /* 0.85倍の縮小をここで完全に打ち消す */
  transform-origin: top center !important;     /* 吹き出しのトゲの位置を基準にする */
}

/* テンキーのボタンサイズが崩れる対策 */
.blocklyNumPadButton {
  width: 60px !important;
  height: 60px !important;
}

      /* 🎨 ナビゲーションバーを強制的に緑色（00d631）にします */
      div[class*="menu-bar_menu-bar"],
      [class*="menu-bar_menu-bar"] {
        background-color: #00d631 !important; 
      }

      /* 🎯 【新常識】古いリンク（mit.edu）の機能をCSSで完全に無効化します */
      a[href*="scratch.mit.edu"] {
        pointer-events: none !important; 
        cursor: default !important;
      }

      /* 🚀 その代わり、特定のロゴ画像（1e9652be...）だけはクリックできるように復活させます */
      img[src*="1e9652bec24bcaacf5285be19746a750"] {
        pointer-events: auto !important;
        cursor: pointer !important;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript" src="lib.min.js"></script>
    <script type="text/javascript" src="chunks/gui.js"></script>

    <!-- 🛠️ ロゴ画像がタップされた時だけ、確実にあなたのサイトへ移動させる安全な仕組み -->
    <script>
      document.addEventListener('click', (e) => {
        // クリックされた要素の「画像URL」に、あのロゴのファイル名が含まれているかチェック
        if (e.target.tagName === 'IMG' && e.target.src.includes('1e9652bec24bcaacf5285be19746a750')) {
          e.preventDefault();
          e.stopPropagation();
          // あなたのトップページへ移動
          window.location.href = 'https://jijuuhuju.github.io/Streech-home/';
        }
      }, true); // 最優先でキャッチ
    </script>
  </body>
</html>
